# Env Vault three-replica StatefulSet.
# Replace every REPLACE_ME value and the example PostgreSQL/Redis service names before applying.
# Keep this file internal to the cluster; do not expose the bootstrap Service publicly.

apiVersion: v1
kind: Namespace
metadata:
  name: env-vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: env-vault
  namespace: env-vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-vault-config
  namespace: env-vault
data:
  config.yaml: |
    server:
      port: 8090
      mode: release

    app:
      name: env-vault
      version: 0.1.0

    auth:
      local:
        enabled: true
        issuer: env-vault
        audience: env-vault-web
        key_id: env-vault-local-v1
        private_key_file: /app/secrets/jwt/jwt-private.pem
        public_key_file: /app/secrets/jwt/jwt-public.pem
        access_token_ttl: 2h
      company:
        enabled: false
        issuer: ""
        audience: ""
        key_id: ""
        public_key: ""
        public_key_file: ""

    security:
      # Keep false in a cluster. The encryption key is injected from Secret.
      allow_config_key_fallback: false
      encryption_key: ""
      master_key_peer_token: ""
      ready_allowlist:
        - method: GET
          path: /api/v1/pub/health
        - method: POST
          path: /api/v1/pub/auth/login
        - method: GET
          path: /api/v1/masterKey/status
        - method: POST
          path: /api/v1/masterKey/share
        - method: GET
          path: /internal/v1/masterKey/ready

    database:
      host: "192.168.1.110"
      #  host: "127.0.0.1"
      #      host: pg-poc-rw.pg-poc.svc.cluster.local
      port: 5432
      user: "env_vault"
      password: "123456"
      name: "env_vault"
      ssl_mode: "disable"
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: "30m"
      connect_timeout: "5s"

    redis:
      enabled: true
      mode: single
      # Change this address for the actual Redis endpoint. Redis Cluster should list all nodes.
      addrs:
    #    - redis.database.svc.cluster.local:6379
        - "192.168.1.110:6379"
      password: ""
      db: 1
      key_prefix: env_vault
      warm_up_on_start: true
      pool_size: 20
      min_idle_conns: 5
      max_retries: 3
      dial_timeout: 5s
      read_timeout: 3s
      write_timeout: 3s
---
apiVersion: v1
kind: Secret
metadata:
  name: env-vault-runtime
  namespace: env-vault
type: Opaque
stringData:
  # Replace all values before applying. Do not commit real values to this file.
  # 必须与 pg-poc 命名空间下 pg-poc-app Secret 的 password 保持一致
  # Kubernetes Secret 不能被其他命名空间的 Pod 直接引用，因此在此注入副本
  database-password: "123456"
  redis-password: ""
  encryption-key: "Pk6V+TnUEZO6R8WOklCSrI/iM4QKHc55VQQrrptmVfk="
  master-key-peer-token: "ES1Gu2txOxcvbPqwcPs+cMd8CCQOE5a7JVczPy0kx7u2mwjqtisWT0tR6WFv4TKb"
---
