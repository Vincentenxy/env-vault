---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: env-vault-bootstrap
  namespace: env-vault
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$1/$3
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: efficient-poc.qiuer.net
      http:
        paths:
          # 启动接口也先进入 Web Nginx，正常阶段由任意 Ready Pod 响应
          - path: /envvault/api/v1/(pub|masterKey)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: env-vault-web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: env-vault
  namespace: env-vault
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: efficient-poc.qiuer.net
      http:
        paths:
          # API 先进入 Web Nginx，由它在普通 Service 暂无 Ready Endpoint 时回退到 Pod 0
          - path: /envvault/api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: env-vault-web
                port:
                  number: 80



# EnvVault Web deployment.
# Build and push harbor.gtjaqh.net/lucy-dev/env-vault-web:0.1.0 before applying.
# The env-vault namespace and backend Service are created by the backend manifest.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-vault-web
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault-web
    app.kubernetes.io/component: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vault-web
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: env-vault-web
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: env-vault-web
              app.kubernetes.io/component: web
      containers:
        - name: env-vault-web
          image: harbor.gtjaqh.net/lucy-dev/env-vault-web:0.0.1-alpha.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            # Normal traffic uses the ready backend replicas; Nginx falls back to
            # env-vault-bootstrap while the master key is still locked.
            - name: API_UPSTREAM
              value: http://env-vault
            - name: API_BOOTSTRAP_UPSTREAM
              value: http://env-vault-bootstrap:8090
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: env-vault-web
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault-web
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: env-vault-web
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: env-vault-web
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault-web
    app.kubernetes.io/component: web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vault-web
      app.kubernetes.io/component: web
---
# All /envvault requests enter the Web container. The prefix is removed before
# forwarding; /api requests are then proxied by Web Nginx to the backend Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: env-vault-web
  namespace: env-vault
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: efficient-poc.qiuer.net
      http:
        paths:
          - path: /envvault(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: env-vault-web
                port:
                  number: 80
