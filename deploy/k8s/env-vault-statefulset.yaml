# Env Vault three-replica StatefulSet.
# Replace every REPLACE_ME value and the example PostgreSQL/Redis service names before applying.
# Public ingress sends API traffic through Web Nginx, which falls back to Pod 0 only when no Ready backend exists.

apiVersion: v1
kind: Namespace
metadata:
  name: env-vault
  # Gateway API 启用后恢复该命名空间标签
  # labels:
  #   env-vault.io/gateway-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: env-vault
  namespace: env-vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-vault-config
  namespace: env-vault
data:
  config.yaml: |
    server:
      port: 8090
      mode: release

    app:
      name: env-vault
      version: 0.0.1

    auth:
      local:
        enabled: true
        issuer: env-vault
        audience: env-vault-web
        key_id: env-vault-local-v1
        private_key_file: /app/secrets/jwt/jwt-private.pem
        public_key_file: /app/secrets/jwt/jwt-public.pem
        access_token_ttl: 2h
      company:
        enabled: false
        issuer: ""
        audience: ""
        key_id: ""
        public_key: ""
        public_key_file: ""

    security:
      # Keep false in a cluster. The encryption key is injected from Secret.
      allow_config_key_fallback: false
      encryption_key: ""
      master_key_peer_token: ""
      master_key_peer_recovery:
        enabled: true
        base_url: http://env-vault.env-vault.svc.cluster.local
        request_timeout: 3s
        initial_retry_interval: 1s
        max_retry_interval: 15s
      ready_allowlist:
        - method: GET
          path: /api/v1/pub/health
        - method: POST
          path: /api/v1/pub/auth/login
        - method: GET
          path: /api/v1/masterKey/status
        - method: POST
          path: /api/v1/masterKey/share
        - method: GET
          path: /internal/v1/masterKey/ready

    database:
    #  host: "192.168.1.110"
    #    host: "127.0.0.1"
      host: postgres-rw.postgres.svc.cluster.local
      port: 5432
      user: "env_vault"
      password: "123456"
      name: "env_vault"
      ssl_mode: "disable"
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: "30m"
      connect_timeout: "5s"

    redis:
      enabled: true
      mode: single
      # Change this address for the actual Redis endpoint. Redis Cluster should list all nodes.
      addrs:
        - redis-replication.redis-poc.svc.cluster.local:6379
    #    - "192.168.1.110:6379"
      password: "Gtja_013e334af7"
      db: 1
      key_prefix: env_vault
      warm_up_on_start: true
      pool_size: 20
      min_idle_conns: 5
      max_retries: 3
      dial_timeout: 5s
      read_timeout: 3s
      write_timeout: 3s
---
apiVersion: v1
kind: Secret
metadata:
  name: env-vault-runtime
  namespace: env-vault
type: Opaque
stringData:
