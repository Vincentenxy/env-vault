apiVersion: v1
kind: Service
metadata:
  name: env-vault-headless
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: env-vault
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The bootstrap Service always targets ordinal 0. Use it only for the initial
# three-share unlock flow, then route normal business traffic to env-vault.
apiVersion: v1
kind: Service
metadata:
  name: env-vault-bootstrap
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: bootstrap
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: env-vault-0
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: env-vault
  namespace: env-vault
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vault
      app.kubernetes.io/component: server
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: env-vault
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
spec:
  serviceName: env-vault-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vault
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: env-vault
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: env-vault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: env-vault
              app.kubernetes.io/component: server
      containers:
        - name: env-vault
          image: env-vault:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8090"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: env-vault-runtime
                  key: database-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: env-vault-runtime
                  key: redis-password
            - name: SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: env-vault-runtime
                  key: encryption-key
            - name: SECURITY_MASTER_KEY_PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: env-vault-runtime
                  key: master-key-peer-token
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: jwt-keys
              mountPath: /app/secrets/jwt
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/pub/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/pub/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # The internal readiness endpoint checks Manager.Ready(). It requires
          # the token injected above and therefore never exposes the token in a URL.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  test -n "$SECURITY_MASTER_KEY_PEER_TOKEN" &&
                  wget -qO- --header="X-Env-Vault-Internal-Token: $SECURITY_MASTER_KEY_PEER_TOKEN"
                  http://127.0.0.1:8090/internal/v1/masterKey/ready |
                  grep -q '"status":"ready"'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: env-vault-config
            defaultMode: 0444
        - name: jwt-keys
          secret:
            secretName: env-vault-jwt
            defaultMode: 0640
