---
apiVersion: v1
kind: Service
metadata:
  name: env-vault-headless
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: env-vault
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The bootstrap Service uses a stable ClusterIP and always targets ordinal 0
# Web Nginx uses it only when the normal Ready Service returns 502/503/504
# Delete an existing Headless bootstrap Service once before applying this change
apiVersion: v1
kind: Service
metadata:
  name: env-vault-bootstrap
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: bootstrap
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: env-vault-0
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: env-vault
  namespace: env-vault
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vault
      app.kubernetes.io/component: server
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: env-vault
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault
    app.kubernetes.io/component: server
spec:
  serviceName: env-vault-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vault
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: env-vault
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: env-vault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: env-vault
              app.kubernetes.io/component: server
      containers:
        - name: env-vault
          image: harbor.gtjaqh.net/lucy-dev/env-vault:0.0.1-alpha.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: SECURITY_MASTER_KEY_PEER_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: env-vault-config
                  key: master-key-peer-token
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/pub/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/pub/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # The internal readiness endpoint checks Manager.Ready(). It requires
          # the token injected above and therefore never exposes the token in a URL.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  test -n "$SECURITY_MASTER_KEY_PEER_TOKEN" &&
                  wget -qO- --header="X-Env-Vault-Internal-Token: $SECURITY_MASTER_KEY_PEER_TOKEN"
                  http://127.0.0.1:8090/internal/v1/masterKey/ready |
                  grep -q '"status":"ready"'
            # 主密钥激活后尽快将 Pod 加入普通业务 Service
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: env-vault-config
            defaultMode: 0444
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: env-vault-bootstrap
  namespace: env-vault
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$1/$3
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: efficient-poc.qiuer.net
      http:
        paths:
          # 启动接口也先进入 Web Nginx，正常阶段由任意 Ready Pod 响应
          - path: /envvault/api/v1/(pub|masterKey)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: env-vault-web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: env-vault
  namespace: env-vault
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: efficient-poc.qiuer.net
      http:
        paths:
          # API 先进入 Web Nginx，由它在普通 Service 暂无 Ready Endpoint 时回退到 Pod 0
          - path: /envvault/api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: env-vault-web
                port:
                  number: 80



# EnvVault Web deployment.
# Build and push harbor.gtjaqh.net/lucy-dev/env-vault-web:0.1.0 before applying.
# The env-vault namespace and backend Service are created by the backend manifest.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-vault-web-auth
  namespace: env-vault
data:
  # Public settings only; JWT keys and gateway credentials belong on the backend
  auth-config.json: |
    {
      "mode": "company",
      "loginUrl": "/tologin.do",
      "returnUrlParam": "url",
      "loginLabel": "公司认证",
      "logoutUrl": "",
      "logoutReturnUrlParam": "url"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-vault-web
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault-web
    app.kubernetes.io/component: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vault-web
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: env-vault-web
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: env-vault-web
              app.kubernetes.io/component: web
      containers:
        - name: env-vault-web
          image: harbor.gtjaqh.net/lucy-dev/env-vault-web:0.0.1-alpha.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            # Normal traffic uses the ready backend replicas; Nginx falls back to
            # env-vault-bootstrap while the master key is still locked.
            - name: API_UPSTREAM
              value: http://env-vault
            - name: API_BOOTSTRAP_UPSTREAM
              value: http://env-vault-bootstrap:8090
          volumeMounts:
            - name: auth-config
              mountPath: /usr/share/nginx/html/auth-config.json
              subPath: auth-config.json
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: auth-config
          configMap:
            name: env-vault-web-auth
---
apiVersion: v1
kind: Service
metadata:
  name: env-vault-web
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault-web
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: env-vault-web
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: env-vault-web
  namespace: env-vault
  labels:
    app.kubernetes.io/name: env-vault-web
    app.kubernetes.io/component: web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: env-vault-web
      app.kubernetes.io/component: web
---
# All /envvault requests enter the Web container. The prefix is removed before
# forwarding; /api requests are then proxied by Web Nginx to the backend Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: env-vault-web
  namespace: env-vault
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: efficient-poc.qiuer.net
      http:
        paths:
          - path: /envvault(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: env-vault-web
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: envvault-web-higress
  namespace: env-vault
  annotations:
    higress.io/use-regex: 'true'
    higress.io/rewrite-target: /$2
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - efficient.qiuer.net
      secretName: qiuer-net
  rules:
    - host: efficient.qiuer.net
      http:
        paths:
          - path: /envvault(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: env-vault-web
                port:
                  number: 80
---
# Register the HTTPS endpoint at https://efficient.qiuer.net/oauth2/auth
# Only the McpBridge named default in the Higress namespace is watched
# If default already contains other registries, merge these entries into its list
apiVersion: networking.higress.io/v1
kind: McpBridge
metadata:
  name: default
  namespace: higress-system
spec:
  registries:
    - name: env-vault-auth
      type: dns
      domain: efficient.qiuer.net
      port: 443
      protocol: HTTPS
      sni: efficient.qiuer.net
