openapi: 3.0.3
info:
  title: Env Vault Secret Group Tags
  version: 0.1.0
  description: |
    Tags belong to tenants and are assigned to a Secret groupId across all environments.
    No individual environment assignment, value search or value version changes.
    Apply secret_tag_relation DDL from database.md before deploying this release.
    Authentication is required. Resource authorization awaits the shared permission system.
    Tag and Secret deletion soft-delete associations in the same transaction.
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /secret/tag/info:
    post:
      operationId: getSecretGroupTags
      summary: Get the actual tenant and tags without reading Secret values
      requestBody:
        $ref: "#/components/requestBodies/Group"
      responses:
        "200": { $ref: "#/components/responses/GroupTags" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Blocked" }
  /secret/tag/update:
    post:
      operationId: replaceSecretGroupTags
      summary: Replace all tags of a Secret group
      description: |
        tagIdList must be provided. [] clears all tags; omission and null are rejected.
        Duplicate IDs are deduplicated. Tags must be active and belong to the actual tenant of the Secret.
        Saves are serialized per group; the last successful save replaces the set.
        Does not modify values, versions or value histories. Writes an audit event in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GroupRequest"
                - type: object
                  required: [tagIdList]
                  properties:
                    tagIdList:
                      { type: array, items: { type: string, format: uuid } }
            examples:
              bind:
                value:
                  {
                    groupId: "b07c984a-5798-48b2-9223-12b0758277ee",
                    tagIdList: ["cadc5fe7-ec9f-4a39-b128-c9a62b9f9e41"],
                  }
              clear:
                value:
                  {
                    groupId: "b07c984a-5798-48b2-9223-12b0758277ee",
                    tagIdList: [],
                  }
      responses:
        "200": { $ref: "#/components/responses/GroupTags" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Blocked" }
  /secret/list:
    post:
      operationId: listSecretsWithTags
      summary: List Secret groups with optional tag filtering
      description: |
        folderGroupId has priority and selects the original folder query mode.
        Otherwise projectId + folderCode + nonempty envList are required; keyList optionally filters exact keys.
        Both modes support tagIdList. Missing/null/[] means no tag filter; multiple IDs use OR semantics.
        Tag filtering is applied in SQL within the original scope and does not duplicate environment instances.
        tagList contains active group tags, including when envList selects only some environments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folderGroupId: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
                folderCode: { type: string }
                envList: { type: array, items: { type: string } }
                keyList: { type: array, items: { type: string } }
                tagIdList:
                  {
                    type: array,
                    nullable: true,
                    items: { type: string, format: uuid },
                  }
              anyOf:
                - required: [folderGroupId]
                - required: [projectId, folderCode, envList]
            example:
              {
                folderGroupId: "f304d750-6eec-4726-bbc8-0e7cbc65808e",
                tagIdList: ["cadc5fe7-ec9f-4a39-b128-c9a62b9f9e41"],
              }
      responses:
        "200":
          description: code 0 is success; parameter and business errors use code -1; starting uses code -2
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [code, msg, data]
                    properties:
                      code: { type: integer, enum: [0] }
                      msg: { type: string }
                      data:
                        type: object
                        required: [secretList]
                        properties:
                          secretList:
                            {
                              type: array,
                              items: { $ref: "#/components/schemas/Secret" },
                            }
                  - $ref: "#/components/schemas/Error"
              example: { code: 0, msg: success, data: { secretList: [] } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Blocked" }
  /secret/info:
    post:
      operationId: getSecretWithTags
      summary: Get a Secret group with its values and tagList
      requestBody: { $ref: "#/components/requestBodies/Group" }
      responses:
        "200":
          description: Same Secret shape as one entry of secret/list; errors use code -1 or -2 and data null
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [code, msg, data]
                    properties:
                      code: { type: integer, enum: [0] }
                      msg: { type: string }
                      data: { $ref: "#/components/schemas/Secret" }
                  - $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Blocked" }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  requestBodies:
    Group:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GroupRequest" }
  schemas:
    GroupRequest:
      type: object
      required: [groupId]
      properties:
        groupId: { type: string, format: uuid }
    Tag:
      type: object
      required: [id, code, name, allowValueSearch]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        allowValueSearch:
          {
            type: boolean,
            description: Stored policy only; value search is not implemented,
          }
    GroupTags:
      type: object
      required: [groupId, tenantId, tagList]
      properties:
        groupId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        tagList: { type: array, items: { $ref: "#/components/schemas/Tag" } }
    Secret:
      type: object
      required: [groupId, key, remark, values, tagList]
      properties:
        groupId: { type: string, format: uuid }
        key: { type: string }
        remark: { type: string }
        tagList: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        values:
          type: object
          additionalProperties:
            type: object
            required: [secretId, folderId, value, version, valueType, updateAt]
            properties:
              secretId: { type: string, format: uuid }
              folderId: { type: string, format: uuid }
              value: { type: string }
              version: { type: integer }
              valueType: { type: string }
              updateAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [-1, -2, 401, 403] }
        msg: { type: string }
        data: { type: object, nullable: true }
  responses:
    GroupTags:
      description: Success code 0; parameters/business errors code -1; starting code -2
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [code, msg, data]
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data: { $ref: "#/components/schemas/GroupTags" }
              - $ref: "#/components/schemas/Error"
          examples:
            success:
              value:
                {
                  code: 0,
                  msg: success,
                  data:
                    {
                      groupId: "b07c984a-5798-48b2-9223-12b0758277ee",
                      tenantId: "bdfe5ed7-ddb2-4e6f-a86b-e0e3f347c1f8",
                      tagList: [],
                    },
                }
            wrongTenant:
              value:
                { code: -1, msg: tag not found in secret tenant, data: null }
            notFound:
              value: { code: -1, msg: secret group not found, data: null }
            omittedTags:
              value:
                {
                  code: -1,
                  msg: "invalid params: tagIdList is required; use [] to clear tags",
                  data: null,
                }
            starting:
              value: { code: -2, msg: 系统启动中, data: null }
    Unauthorized:
      description: Invalid or missing JWT
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: 401, msg: Unauthorized, data: null }
    Blocked:
      description: User is blocked
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: 403, msg: 用户被锁定, data: null }
