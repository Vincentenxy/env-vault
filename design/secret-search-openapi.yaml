openapi: 3.0.3
info:
  title: Env Vault Secret Search
  version: 1.0.0
  description: |
    Search shared Secret keys or remarks using case-insensitive literal substring matching.
    Personal secrets are excluded. This phase requires authentication but resource/environment
    authorization is still pending, consistent with the existing shared secret/list endpoint.
    Results are paginated by groupId; every matched environment of one group stays on the same page.
servers:
  - url: "{{server}}"
security:
  - BearerAuth: []
paths:
  /api/v1/secret/search:
    post:
      tags: [secret]
      summary: 搜索共享密钥 Key 或备注
      description: |
        Multiple scopes form a union. Tenant/org scopes cover their descendants; a folder scope
        uses folderGroupId and covers the folder and its currently supported second-level children.
        With no scopes, all currently permitted shared secrets are searched.
        A single-project selection requires a nonempty envList of existing environment codes.
        Cross-project and tenant/org selections must omit envList or send [].
        Keyword is trimmed; %, _ and ! are literal characters, not wildcards.
        Keywords without three consecutive Unicode letters/numbers require project/folder scopes.
        Empty keyword performs paginated browsing. Tag and value search are not supported yet.
        Default query timeout is 5 seconds; no partial success is returned on timeout/decryption failure.
      operationId: searchSecrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scopes:
                  type: array
                  maxItems: 100
                  default: []
                  items:
                    type: object
                    required: [scopeType, scopeId]
                    additionalProperties: false
                    properties:
                      scopeType:
                        { type: string, enum: [tenant, org, project, folder] }
                      scopeId: { type: string, format: uuid }
                envList:
                  type: array
                  maxItems: 200
                  default: []
                  items: { type: string }
                keyword: { type: string, maxLength: 256, default: "" }
                pageNum:
                  type: integer
                  default: 1
                  description: Values <= 0 normalize to 1
                pageSize:
                  type: integer
                  default: 20
                  description: Values <= 0 normalize to 20; values > 200 normalize to 200
            example:
              scopes: []
              envList: []
              keyword: SERVICE_DOMAIN
              pageNum: 1
              pageSize: 20
      responses:
        "200":
          description: Success or business error; code 0 means success, -1 means failure, -2 means master key is not ready
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [code, msg, data]
                    properties:
                      code: { type: integer, enum: [0] }
                      msg: { type: string }
                      data:
                        type: object
                        required: [total, list]
                        properties:
                          total:
                            {
                              type: integer,
                              format: int64,
                              description: Number of matching distinct groupIds,
                            }
                          list:
                            type: array
                            items: { $ref: "#/components/schemas/Secret" }
                  - $ref: "#/components/schemas/Error"
              examples:
                empty:
                  value: { code: 0, msg: success, data: { total: 0, list: [] } }
                shortKeyword:
                  value:
                    {
                      code: -1,
                      msg: 搜索全部范围、租户或组织时，关键词需包含至少 3 个连续的中文、字母或数字；短关键词请先选择项目或文件夹,
                      data: null,
                    }
                invalidEnvironment:
                  value:
                    {
                      code: -1,
                      msg: 同一项目请指定有效环境，跨项目或租户、组织范围不能指定环境,
                      data: null,
                    }
                invalidScope:
                  value:
                    {
                      code: -1,
                      msg: 所选项目或文件夹不存在或已删除，请刷新范围,
                      data: null,
                    }
                timeout:
                  value:
                    {
                      code: -1,
                      msg: 搜索超时，请缩小范围或补充关键词后重试,
                      data: null,
                    }
                decryptFailure:
                  value:
                    { code: -1, msg: decrypt secret value failed, data: null }
                starting:
                  value: { code: -2, msg: 系统启动中, data: null }
        "401":
          description: Invalid or missing authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: 401, msg: Unauthorized, data: null }
        "403":
          description: Blocked user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: 403, msg: 用户被锁定, data: null }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Resource:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Secret:
      type: object
      required: [groupId, key, remark, scope, tagList, values]
      properties:
        groupId: { type: string, format: uuid }
        key: { type: string }
        remark: { type: string }
        scope:
          type: object
          required: [tenant, organization, project, folders]
          properties:
            tenant: { $ref: "#/components/schemas/Resource" }
            organization: { $ref: "#/components/schemas/Resource" }
            project: { $ref: "#/components/schemas/Resource" }
            folders:
              type: array
              minItems: 1
              description: Ordered path; every id is a logical folderGroupId, not an environment-specific folderId
              items:
                allOf:
                  - $ref: "#/components/schemas/Resource"
                  - type: object
                    required: [code]
                    properties:
                      code: { type: string }
        tagList:
          type: array
          items:
            type: object
            required: [id, code, name, allowValueSearch]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              allowValueSearch:
                {
                  type: boolean,
                  description: Existing tag metadata; not a permission switch,
                }
        values:
          type: array
          minItems: 1
          items:
            type: object
            required:
              [
                secretId,
                envId,
                envCode,
                envName,
                orderNo,
                value,
                version,
                updateAt,
              ]
            properties:
              secretId: { type: string, format: uuid }
              envId: { type: string, format: uuid }
              envCode: { type: string }
              envName: { type: string }
              orderNo: { type: number }
              value:
                {
                  type: string,
                  description: Decrypted value; an empty string means a real empty value,
                }
              version: { type: integer }
              updateAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, enum: [-1, -2, 401, 403] }
        msg: { type: string }
        data: { type: object, nullable: true }
