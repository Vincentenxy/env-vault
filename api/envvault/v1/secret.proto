syntax = "proto3";

package envvault.v1;

import "google/protobuf/timestamp.proto";

option go_package = "env-vault/api/envvault/v1;envvaultv1";
option java_package = "net.qiuer.envvault.v1";
option java_multiple_files = true;
option java_outer_classname = "SecretProtocol";

// SecretService 提供应用启动时所需的目录密钥读取能力
service SecretService {
  // ListSecrets 查询单个目录、单个环境下的密钥，key_list 为空时返回全部 key
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
}

// ListSecretsRequest 通过一种目录标识定位资源，避免多种定位条件互相覆盖
message ListSecretsRequest {
  oneof folder {
    // folder_id 是某个环境下的 folder_info.id，可省略 env_code
    string folder_id = 1;
    // folder_group_id 是跨环境逻辑目录 ID，必须同时指定 env_code
    string folder_group_id = 2;
    // folder_code 必须同时指定 project_id 和 env_code
    string folder_code = 3;
  }
  string project_id = 4;
  string env_code = 5;
  // 精确匹配 key，不执行模糊搜索
  repeated string key_list = 6;
}

// ListSecretsResponse 返回实际定位的目录，以及兼容现有列表含义的密钥数据
message ListSecretsResponse {
  FolderMetadata folder = 1;
  repeated Secret secret_list = 2;
}

// FolderMetadata 标识实际读取的目录实例，供调用方核对项目和环境
message FolderMetadata {
  string folder_id = 1;
  string folder_group_id = 2;
  string folder_code = 3;
  string project_id = 4;
  string env_code = 5;
}

// Secret 按逻辑密钥聚合，values 仅包含本次请求指定的环境
message Secret {
  string group_id = 1;
  string key = 2;
  string remark = 3;
  map<string, SecretValue> values = 4;
  repeated TagSummary tag_list = 5;
}

// SecretValue 是服务端完成解密后的值，不要求 SDK 持有主密钥
message SecretValue {
  string secret_id = 1;
  string folder_id = 2;
  string value = 3;
  int32 version = 4;
  string value_type = 5;
  google.protobuf.Timestamp update_at = 6;
}

// TagSummary 复用现有 secret/list 的标签含义
message TagSummary {
  string id = 1;
  string code = 2;
  string name = 3;
  bool allow_value_search = 4;
}
