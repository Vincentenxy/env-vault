server:
  port: 8090
  mode: debug # debug / release / test

app:
  name: env-vault
  version: 0.1.0

auth:
  jwt_public_key: 

security:
  # 开发环境允许使用配置文件中的密钥，生产环境必须设置为 false
  allow_config_key_fallback: false
  # secret value 加密私钥（AES-256-GCM，32 字节 base64 编码，测试环境使用）
  encryption_key: "Pk6V+TnUEZO6R8WOklCSrI/iM4QKHc55VQQrrptmVfk="
  # 主密钥未就绪时按请求方法和精确路径放行
  ready_allowlist:
    - method: GET
      path: /api/v1/pub/health
    - method: GET
      path: /api/v1/pub/masterKey/status
    - method: POST
      path: /api/v1/pub/masterKey/shares
    # 登录接口实现后沿用该公开路径
    - method: POST
      path: /api/v1/pub/auth/login


database:
  host: "192.168.1.110"
#  host: "127.0.0.1"
  port: 5432
  user: "env_vault"
  password: "123456"
  name: "env_vault"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "30m"
  connect_timeout: "5s"

redis:
  enabled: true
  mode: "single"
  addrs:
#    - "127.0.0.1:6379"
    - "192.168.1.110:6379"
  password: "123456"
  db: 1
  key_prefix: "env_vault"
  warm_up_on_start: true
  pool_size: 10
  min_idle_conns: 2
  max_retries: 3
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
