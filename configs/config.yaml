server:
  port: 8090
  mode: debug # debug / release / test

app:
  name: env-vault
  version: 0.1.0

auth:
  local:
    enabled: true
    issuer: env-vault
    audience: env-vault-web
    key_id: env-vault-local-v1
    private_key_file: ./.local/auth/jwt-private.pem
    public_key_file: ./.local/auth/jwt-public.pem
    access_token_ttl: 2h
  # 公司认证接入后填写真实 issuer/audience 并启用；公钥不用于签发本地 JWT
  company:
    enabled: true
    issuer: https://eiam.qiuer.net/auth/oidc/62F295C3C382499EA2124E6C8B080B8E
    audience: ZmEyMjBjNWFhNmI2NDhlOWE4NzYwNjkyNjQ5ZWQ4NTg
    key_id: ""
    public_key: 

security:
  # 开发环境允许使用配置文件中的密钥，生产环境必须设置为 false
  allow_config_key_fallback: false
  # 集群内部主密钥传输令牌；生产环境应通过 SECURITY_MASTER_KEY_PEER_TOKEN 环境变量注入
  # 未配置时 /internal/v1/masterKey/transfer 保持禁用
  master_key_peer_token: ""
  # secret value 加密私钥（AES-256-GCM，32 字节 base64 编码，测试环境使用）
  encryption_key: "Pk6V+TnUEZO6R8WOklCSrI/iM4QKHc55VQQrrptmVfk="
  # 主密钥未就绪时按请求方法和精确路径放行
  ready_allowlist:
    - method: GET
      path: /api/v1/pub/health
    - method: POST
      path: /api/v1/pub/auth/login
    # 以下接口绕过 Ready 检查，但仍由 JWT 中间件认证
    - method: GET
      path: /api/v1/masterKey/status
    - method: POST
      path: /api/v1/masterKey/share
    # 集群内部 readiness probe，仍由内部令牌校验
    - method: GET
      path: /internal/v1/masterKey/ready


database:
  host: "192.168.1.110"
#  host: "127.0.0.1"
  port: 5432
  user: "env_vault"
  password: "123456"
  name: "env_vault"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "30m"
  connect_timeout: "5s"

redis:
  enabled: true
  mode: "single"
  addrs:
#    - "127.0.0.1:6379"
    - "192.168.1.110:6379"
  password: "123456"
  db: 1
  key_prefix: "env_vault"
  warm_up_on_start: true
  pool_size: 10
  min_idle_conns: 2
  max_retries: 3
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"


